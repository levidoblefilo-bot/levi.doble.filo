<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Imagen Personal | Levi Doble Filo</title>
    <style>
        body, html { margin: 0; padding: 0; background: #000; color: #fff; font-family: 'Cinzel', serif; }
        
        .hero {
            height: 35vh;
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1560066984-138dadb4c035?q=80');
            background-size: cover; background-position: center;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            border-bottom: 2px solid #d4af37;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }

        .main-menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .category-card {
            background: #0a0a0a;
            border: 1px solid #333;
            padding: 40px 20px;
            text-align: center;
            transition: 0.4s;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .category-card:hover {
            border-color: #d4af37;
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.2);
        }

        .category-card h2 { color: #d4af37; letter-spacing: 5px; margin-bottom: 10px; }
        .category-card p { font-size: 0.8rem; opacity: 0.7; letter-spacing: 2px; }

        /* Botón especial para saltar al Blog desde aquí */
        .blog-promo {
            margin-top: 50px;
            text-align: center;
            padding: 30px;
            border: 1px dashed #d4af37;
        }

        .btn-blog {
            color: #d4af37;
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 3px;
            border: 1px solid #d4af37;
            padding: 10px 25px;
            transition: 0.3s;
        }

        .btn-blog:hover { background: #d4af37; color: #000; }

        .back { position: absolute; top: 20px; left: 20px; color: #fff; text-decoration: none; font-size: 0.8rem; opacity: 0.6; }
    </style>
</head>
<body>

    <a href="estudio.html" class="back">← VOLVER</a>

    <div class="hero">
        <h1 style="letter-spacing: 12px; color: #d4af37;">IMAGEN PERSONAL</h1>
        <p style="letter-spacing: 4px;">SERVICIOS & ASESORÍA</p>
    </div>

    <div class="container">
        <div class="main-menu-grid">
            
            <a href="boutique-menu.html" class="category-card">
                <h2>BOUTIQUE</h2>
                <p>Cortes, Barbería y Extensiones</p>
            </a>

            <a href="servicios-menu.html" class="category-card">
                <h2>SERVICIOS</h2>
                <p>Cejas, Colorimetría y Rostro</p>
            </a>

            <a href="cuidados-menu.html" class="category-card">
                <h2>CUIDADOS</h2>
                <p>Manos, Pies y Masajes</p>
            </a>

        </div>

        <div class="blog-promo">
            <p style="letter-spacing: 2px; margin-bottom: 20px;">¿QUIERES VER QUÉ CORTE LE QUEDA A TU TIPO DE ROSTRO?</p>
            <a href="blog.html" class="btn-blog">VER BLOG DE TENDENCIAS</a>
        </div>
    </div>

</body>
</html>
