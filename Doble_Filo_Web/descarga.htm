<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><title>Levi Doble Filo | Welcome</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; font-family: 'Cinzel', serif; }
        .bg-slider { position: absolute; width: 100%; height: 100%; z-index: 1; }
        .slide { position: absolute; width: 100%; height: 100%; background-size: cover; background-position: center; opacity: 0; filter: brightness(25%); animation: fade 10s infinite; }
        .slide:nth-child(1) { background-image: url('https://images.unsplash.com/photo-1512690196236-d5a743f19a5a?q=80'); animation-delay: 0s; }
        .slide:nth-child(2) { background-image: url('https://images.unsplash.com/photo-1522337660859-02fbefca4702?q=80'); animation-delay: 5s; }
        @keyframes fade { 0%, 100% { opacity: 0; } 20%, 80% { opacity: 1; } }
        .main { position: relative; z-index: 10; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; text-align: center; color: white; }
        .logo { width: 300px; filter: drop-shadow(0 0 20px rgba(212,175,55,0.5)); }
        .btn-enter { margin-top: 40px; padding: 15px 40px; border: 1px solid #d4af37; color: #d4af37; text-decoration: none; letter-spacing: 5px; transition: 0.4s; background: rgba(0,0,0,0.5); }
        .btn-enter:hover { background: #d4af37; color: #000; box-shadow: 0 0 30px #d4af37; }
    </style>
</head>
<body>
    <div class="bg-slider"><div class="slide"></div><div class="slide"></div></div>
    <div class="main">
        <img src="LOGO.png" alt="Levi Doble Filo" class="logo">
        <a class='btn-enter' href='/estudio'>ENTRAR</a>
    </div>
</body>
</html>
