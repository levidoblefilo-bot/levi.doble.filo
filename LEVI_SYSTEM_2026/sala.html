<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SALA | Protocolo Levi</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* PROTECCIÓN GLOBAL */
        * {
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-user-drag: none;
        }

        body, html { margin: 0; padding: 0; background: #000; overflow: hidden; height: 100vh; width: 100vw; font-family: 'Cinzel', serif; perspective: 1500px; }
        
        .fondo-wrapper {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 0; transition: transform 3s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            pointer-events: none; /* Protege el fondo */
        }

        .hero-bg { 
            width: 100%; height: 100%;
            background: url('sala.png') no-repeat center bottom; 
            background-size: 100% 100%; filter: brightness(0.3);
        }

        .sesgar-izquierda-total { transform: scale(1.3) rotateY(20deg) translateX(10%); }
        .sesgar-derecha-total { transform: scale(1.3) rotateY(-20deg) translateX(-10%); }

        .escena-central {
            position: absolute; bottom: 15%; left: 50%; transform: translateX(-50%);
            display: flex; align-items: flex-end; justify-content: center;
            width: 100%; z-index: 10;
        }

        .figura {
            height: 40vh; width: auto; 
            filter: drop-shadow(0 0 20px rgba(0,0,0,0.9));
            -webkit-mask-image: linear-gradient(to bottom, black 85%, transparent 100%);
            transition: all 1s ease;
            pointer-events: none; /* Protege tus personajes de ser descargados con click derecho */
        }

        #panel-nombre {
            position: absolute; right: 5%; top: 25%; width: 280px;
            z-index: 100; background: rgba(0,0,0,0.8); border: 1px solid #ffd700;
            padding: 20px; text-align: center; transition: opacity 0.8s;
            pointer-events: auto;
        }

        #input-nombre {
            width: 90%; background: transparent; border: none; border-bottom: 1px solid #ffd700;
            color: #fff; font-family: 'Cinzel'; text-align: center; margin: 15px 0; outline: none;
            -webkit-user-select: text; user-select: text; /* Permite escribir el nombre */
        }

        .menu-interfaz { position: absolute; bottom: 8%; left: 50%; transform: translateX(-50%); display: flex; gap: 20px; z-index: 30; }
        .btn-gold { padding: 10px 25px; border: 1px solid #ffd700; background: rgba(0,0,0,0.8); color: #ffd700; cursor: pointer; font-family: 'Cinzel'; letter-spacing: 2px; transition: 0.5s; pointer-events: auto; }
        .btn-gold:hover { background: #ffd700; color: #000; }
        .seleccionado { background: #ffd700; color: #000; }

        .invisible { display: none !important; opacity: 0; }
        #velo { position: fixed; inset: 0; background: #000; z-index: 1000; transition: 1.5s; pointer-events: none; }
    </style>
</head>
<body oncontextmenu="return false;"> <audio id="musica-fondo" loop><source src="horas.mp3" type="audio/mpeg"></audio>
    <div id="velo"></div>
    <div class="fondo-wrapper" id="camara"><div class="hero-bg"></div></div>

    <div id="panel-nombre">
        <label style="color: #ffd700; font-size: 0.8rem;">IDENTIFÍQUESE (OPCIONAL)</label>
        <input type="text" id="input-nombre" placeholder="SU NOMBRE AQUÍ">
        <p id="feedback-asistente" style="color: #fff; font-size: 0.7rem; margin-top: 10px;"></p>
    </div>

    <div class="escena-central">
        <div style="display: flex; align-items: flex-end; gap: 40px;">
            <img src="avatar_hombre.png" class="figura invisible" id="fig-H">
            <img src="asistente.png" class="figura" id="fig-A">
            <img src="avatar_mujer.png" class="figura invisible" id="fig-M">
        </div>
    </div>

    <div class="menu-interfaz" id="menu-id">
        <button class="btn-gold" id="btn-H" onclick="seleccionar('H')">HOMBRE</button>
        <button class="btn-gold" id="btn-M" onclick="seleccionar('M')">MUJER</button>
        <button class="btn-gold" onclick="activarPuertas()">CONTINUAR</button>
    </div>

    <div class="menu-interfaz invisible" id="menu-puertas">
        <button class="btn-gold" onclick="ir('izquierda', 'imagen_menu.html')">IMAGEN</button>
        <button class="btn-gold" onclick="ir('derecha', 'block.html')">BLOCK</button>
    </div>

    <script>
        // PROTECCIÓN DE TECLADO
        document.onkeydown = function(e) {
            if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || (e.ctrlKey && e.keyCode == 85)) return false;
        };

        const music = document.getElementById('musica-fondo');
        let vozLatina = null;
        let p_H = false, p_M = false;

        window.speechSynthesis.onvoiceschanged = () => {
            const voces = window.speechSynthesis.getVoices();
            vozLatina = voces.find(v => v.lang.includes('es-MX')) || voces.find(v => v.lang.includes('es'));
        };

        window.onload = () => { 
            document.getElementById('velo').style.opacity = '0'; 
            localStorage.setItem('p_H', 'false');
            localStorage.setItem('p_M', 'false');
            // Intentar reproducir música al cargar (si hubo interacción previa en index)
            music.volume = 0.5;
            music.play().catch(() => console.log("Esperando interacción..."));
        };

        function hablar(t) {
            window.speechSynthesis.cancel();
            document.getElementById('feedback-asistente').innerText = t;
            const msg = new SpeechSynthesisUtterance(t);
            if(vozLatina) msg.voice = vozLatina; 
            msg.pitch = 0.85; msg.rate = 0.9;
            window.speechSynthesis.speak(msg);
        }

        function seleccionar(tipo) {
            music.play(); // Asegura audio tras interacción
            const fig = document.getElementById('fig-' + tipo);
            const btn = document.getElementById('btn-' + tipo);
            const nombre = document.getElementById('input-nombre').value;
            
            if (tipo === 'H') p_H = !p_H; else p_M = !p_M;
            
            fig.classList.toggle('invisible');
            btn.classList.toggle('seleccionado');
            
            let saludo = nombre ? `${nombre}, unidad vinculada.` : "Unidad vinculada.";
            hablar(saludo);
        }

        function activarPuertas() {
            const nombre = document.getElementById('input-nombre').value;
            localStorage.setItem('user_name', nombre);
            localStorage.setItem('p_H', p_H);
            localStorage.setItem('p_M', p_M);

            document.getElementById('panel-nombre').classList.add('invisible');
            document.getElementById('menu-id').classList.add('invisible');
            document.getElementById('menu-puertas').classList.remove('invisible');
            
            hablar(nombre ? `${nombre}, las puertas están listas. Elige tu destino.` : "Puertas activas. Elige tu destino.");
        }

        function ir(lado, url) {
            const camara = document.getElementById('camara');
            localStorage.setItem('musicTime', music.currentTime);
            camara.className = 'fondo-wrapper ' + (lado === 'izquierda' ? 'sesgar-izquierda-total' : 'sesgar-derecha-total');
            document.getElementById('velo').style.opacity = '1';
            setTimeout(() => { window.location.href = url; }, 2500);
        }
    </script>
</body>
</html>
